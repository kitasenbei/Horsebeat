# One static site on a host that already terminates TLS for other things.
#
# Its own compose project, so it starts and stops without naming anyone else's
# stack. The only thing it borrows is the network the shared Caddy container
# sits on, which it has to join for Caddy to resolve `horsebeat-web` by name.
# That network is named by EDGE_NETWORK in the deploy environment, so no host
# of ours appears in this file.
#
# HorseBeat has no API, no database and no server-side state, so there is no
# image to build: stock nginx serves a directory that CI keeps in sync. The
# bundle is a bind mount rather than a baked image, which is why a deploy is a
# file copy and needs no container restart.

name: horsebeat

services:
    horsebeat-web:
        image: nginx:alpine
        volumes:
            - /opt/horsebeat/dist:/usr/share/nginx/html:ro
        expose:
            - "80"
        networks:
            - edge
        restart: unless-stopped

networks:
    edge:
        external: true
        name: ${EDGE_NETWORK}
