# Builds the bundle and copies it to a host that already terminates TLS with a
# shared Caddy container.
#
# DEPLOY_STACK_DIR is the directory on the host holding that stack's site block
# directory, and EDGE_NETWORK is the docker network its Caddy sits on. Both are
# repository variables, so no host of ours is named in this file.
#
# Every docker call over ssh ends in `</dev/null`. The script arrives on
# standard input, and a docker command that attaches stdin eats the rest of it,
# which exits 0 having done half the work.

name: deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Check
              run: |
                  npx tsc -b
                  npx oxlint src

            - run: npm run build

            - name: Authorise the server
              run: |
                  mkdir -p ~/.ssh
                  printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
                  chmod 600 ~/.ssh/id_deploy
                  printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

            - name: Ship the bundle
              env:
                  DESTINATION: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_IP }}
                  STACK: ${{ vars.DEPLOY_STACK_DIR }}
              run: |
                  ssh -i ~/.ssh/id_deploy "$DESTINATION" \
                      "mkdir -p /opt/horsebeat/dist $STACK/caddy-conf.d" </dev/null

                  # --delete so a file dropped from the build leaves the server
                  # too. The directory itself is never replaced: Caddy and nginx
                  # hold a bind mount to this inode and would keep serving the
                  # old one.
                  rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
                      dist/ "$DESTINATION:/opt/horsebeat/dist/"

                  scp -i ~/.ssh/id_deploy deploy/horsebeat.caddy \
                      "$DESTINATION:$STACK/caddy-conf.d/horsebeat.caddy"
                  scp -i ~/.ssh/id_deploy deploy/docker-compose.horsebeat.yml \
                      "$DESTINATION:$STACK/docker-compose.horsebeat.yml"

            - name: Start the site
              env:
                  DESTINATION: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_IP }}
                  STACK: ${{ vars.DEPLOY_STACK_DIR }}
                  EDGE_NETWORK: ${{ vars.EDGE_NETWORK }}
              run: |
                  ssh -i ~/.ssh/id_deploy "$DESTINATION" \
                      "STACK='$STACK' EDGE_NETWORK='$EDGE_NETWORK' bash -s" <<'REMOTE'
                  set -e
                  cd "$STACK"
                  export EDGE_NETWORK
                  docker compose -f docker-compose.horsebeat.yml up -d </dev/null

                  # Caddy belongs to the other stack, so it is reloaded in
                  # place. Recreating it from this file would lose everything
                  # that stack gives it.
                  docker exec -i "$(docker ps -qf name=caddy | head -n1)" \
                      caddy reload --config /etc/caddy/Caddyfile </dev/null
                  REMOTE
